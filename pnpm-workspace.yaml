packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
  protobufjs: false
  workerd: true

catalog:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^22
  zod: 4.6.7
  typescript: ^5
  vite: 8.3.4
  hono: 4.13.13

minimumReleaseAgeExclude:
  - inngest@4.24.0
  - react-server-dom-webpack@19.3.1
  - vinext@1.2.0
